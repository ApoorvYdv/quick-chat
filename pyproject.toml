[project]
name = "quick-chat"
version = "0.1.0"
description = "Quick Chat is a real-time messaging application"
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.0.1",
    "psycopg[binary]>=3.2.3",
    "sqlalchemy>=2.0.52",
    "uuid-utils>=0.17.0",
    "greenlet>=3.5.5",
    "alembic>=1.19.2",
    "fastapi>=0.141.1",
    "aioboto3>=15.5.0",
    "gunicorn>=26.2.0",
    "uvicorn[standard]>=0.52.4",
    "pydantic-settings>=2.15.0",
    "sentence-transformers>=6.0.1",
    "torch>=2.2",
    "starlette-context>=0.5.1",
    "langgraph>=1.2.11",
    "langchain-core>=1.6.3",
    "langgraph-checkpoint-postgres>=3.1.2",
    "langgraph-supervisor>=0.0.31",
    "anthropic>=1.5.0",
    "openai>=3.13.0",
    "qdrant-client>=1.19.1",
    "structlog>=26.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/quick_chat_api", "tests"]

[tool.hatch.build.targets.sdist]
include = [
  "src/quick_chat_api",
  "tests",
  "dockerfile",
  "docker-compose.yml",
]

# sentence-transformers pulls in torch; PyPI's default torch wheel bundles
# full GPU/CUDA support (~3GB of nvidia-* packages) that this service never
# uses. Point torch at PyTorch's CPU-only wheel index instead.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 88
extend-exclude = ["src/quick_chat_api/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "SIM", "RUF"]
# E501: the formatter owns line length. UP042/UP046: str-enum and PEP 695
# modernizations deferred; not worth churning stable constants/models here.
ignore = ["E501", "UP042", "UP046"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.ruff.format]
quote-style = "double" # Optional, black-like style

[tool.mypy]
files = ["src"]
mypy_path = "src"
explicit_package_bases = true
exclude = ["quick_chat_api/migrations"]
ignore_missing_imports = true

# hybrid_property's expression setter intentionally redefines the name.
[[tool.mypy.overrides]]
module = "quick_chat_api.core.models.*"
disable_error_code = ["no-redef"]

[tool.pytest.ini_options]
addopts = "-n auto -m 'not integration'"
markers = ["integration: needs Docker (Postgres/Qdrant via testcontainers); run with -m integration"]
asyncio_mode = "auto"
pythonpath = ["src", "."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.10",
    "testcontainers>=4.15.0",
]

[project.scripts]
migrate = "quick_chat_api.migrations.run_migrations:main"

[tool.bandit]
exclude_dirs = ["tests", "src/quick_chat_api/migrations"]
