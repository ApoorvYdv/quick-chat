[project]
name = "quick-chat"
version = "0.1.0"
description = "Quick Chat is a real-time messaging application"
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.0.1",
    "psycopg[binary]>=3.2.3",
    "sqlalchemy>=2.0.52",
    "uuid-utils>=0.17.0",
    "greenlet>=3.5.5",
    "alembic>=1.19.2",
    "pgvector>=0.5.0",
    "fastapi>=0.141.1",
    "aioboto3>=15.5.0",
    "psycopg2-binary>=2.9.12",
    "gunicorn>=26.2.0",
    "uvicorn[standard]>=0.52.4",
    "pydantic-settings>=2.15.0",
    "asyncpg>=0.31.0",
    "sentence-transformers>=6.0.1",
    "torch>=2.2",
    "starlette-context>=0.5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/quick_chat_api", "tests"]

[tool.hatch.build.targets.sdist]
include = [
  "src/quick_chat_api",
  "tests",
  "dockerfile",
  "docker-compose.yml",
]

# sentence-transformers pulls in torch; PyPI's default torch wheel bundles
# full GPU/CUDA support (~3GB of nvidia-* packages) that this service never
# uses. Point torch at PyTorch's CPU-only wheel index instead.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 88
extend-exclude = []

[tool.ruff.format]
quote-style = "double" # Optional, black-like style

[tool.mypy]
files = ["src"]
exclude = ["quick_chat_api.migrations"]

[tool.pytest.ini_options]
addopts = "-n auto"
pythonpath = ["src", "."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
]

[project.scripts]
migrate = "quick_chat_api.migrations.run_migrations:main"
