services:
  # This service runs the postgres DB used by fastapi app server
  # Uses Timescale's image (bundles timescaledb, pgvector, pgvectorscale)
  # so local dev matches the extensions available on Tiger Cloud.
  postgres_db:
    image: timescale/timescaledb-ha:pg18-oss
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: quick_chat
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/home/postgres/pgdata/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U root -d quick_chat" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - court-cms-net

  # This service runs the fastapi app server for running APIs
  app:
    build:
      context: .
      dockerfile: ./dockerfile
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: 1
      LOG_LEVEL: debug
      DB_USERNAME: root
      DB_PASSWORD: root
      DB_NAME: quick_chat
      DB_PORT: 5432
      DB_HOST: postgres_db
      AWS_S3_BUCKET: quick-chat-storage
      AWS_ACCESS_KEY_ID: username
      AWS_SECRET_ACCESS_KEY: password
      AWS_DEFAULT_REGION: ap-south-1
    # command: [ "uv", "run", "--", "gunicorn", "quick_chat_api.main:app", "--workers=4", "--worker-class=quick_chat_api.workers.RestartableUvicornWorker", "--bind=0.0.0.0:8000", "--access-logfile=-", "--reload", "--log-level=debug" ]
    depends_on:
      - postgres_db
    volumes:
      - ./src/quick_chat_api:/quick_chat_api/src/quick_chat_api
      - ./tests:/quick_chat_api/tests
    networks:
      - court-cms-net

networks:
  court-cms-net:
    driver: bridge

volumes:
  pg_data:
